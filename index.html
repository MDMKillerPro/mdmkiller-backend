<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDMKillerPro | Permanent Device Unlock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: all 0.2s ease;
        }

        body {
            background-color: #121820;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        nav {
            background-color: #161d26;
            border-bottom: 1px solid #1f2a38;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-items {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-link {
            color: #8fa0b5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            color: #ffffff;
        }

        /* Main Container */
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            flex-grow: 1;
        }

        .deployment-status {
            color: #4ade80;
            font-size: 14px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 25px;
            color: #ffffff;
        }

        /* Buy Now Button */
        .btn-buy {
            display: inline-block;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            text-decoration: none;
            padding: 12px 35px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            margin-bottom: 35px;
        }

        .btn-buy:hover {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
            transform: translateY(-1px);
        }

        /* Portal Card Box */
        .portal-card {
            background-color: #19222d;
            border: 1px solid #243141;
            border-radius: 12px;
            padding: 30px 25px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
        }

        /* Custom SVG Metallic Shield Logo */
        .shield-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px auto;
            display: block;
        }

        .portal-title {
            text-align: center;
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background-color: #121820;
            border: 1px solid #243141;
            border-radius: 6px;
            padding: 12px 15px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        /* Request Activation Button */
        .btn-submit {
            width: 100%;
            background-color: #2e3947;
            border: 1px solid #3f4d5e;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            background-color: #344252;
            color: #ffffff;
        }

        /* Info Status Rows */
        .status-row {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .status-val-active { color: #4ade80; }
        .status-val-live { color: #64748b; }
        .status-val-rate { color: #10b981; }

        /* Bottom Branding Section */
        .branding {
            margin: 20px 0;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px auto;
            display: block;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 15px;
        }

        /* Footer Links */
        footer {
            margin-top: auto;
            padding-bottom: 20px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
        }

        .footer-links a:hover {
            color: #94a3b8;
        }

        .copyright {
            font-size: 11px;
            color: #475569;
        }
    </style>
</head>
<body>

<nav>
    <ul class="nav-items">
        <li><a class="nav-link" href="/">Home</a></li>
        <li><a class="nav-link active" href="/distributor&resellers">Distributors</a></li>
        <li><a class="nav-link" href="/distributor&resellers">Resellers</a></li>
        <li><a class="nav-link" href="#">Pricing</a></li>
        <li><a class="nav-link" href="#">Models</a></li>
        <li><a class="nav-link" href="#">API</a></li>
    </ul>
</nav>

<div class="container">
    <div class="deployment-status">Deployment Stable 2.0</div>
    <h1>Permanent Device Unlock</h1>
    
    <button class="btn-buy" onclick="window.open('https://t.me/Mdmkillerpro', '_blank')">Buy Now</button>

    <div class="portal-card">
        <svg class="shield-icon" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 5L5 15V30C5 45 20 53 30 55C40 53 55 45 55 30V15L30 5Z" fill="#243141" stroke="#475569" stroke-width="2"/>
            <path d="M30 12L12 18.5V30C12 41.2 22.5 47.8 30 49.5C37.5 47.8 48 41.2 48 30V18.5L30 12Z" fill="#1e293b"/>
            <path d="M22 22L30 30L38 22M30 30V40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        
        <div class="portal-title">Reseller & Distributor Portal</div>
        
        <div class="form-group">
            <label>Secret Key</label>
            <input type="password" id="auth_key" placeholder="Enter Secret Key">
        </div>
        
        <div class="form-group">
            <label>Customer Email</label>
            <input type="email" id="customer_email" placeholder="Customer Email">
        </div>
        
        <button class="btn-submit" onclick="processActivation()">Request Activation</button>
        
        <div class="status-row">API Status: <span class="status-val-active">Active</span></div>
        <div class="status-row">Server: <span class="status-val-live">24/7 Live</span></div>
        <div class="status-row">Activation Rate: <span class="status-val-rate">100%</span></div>
        
        <div id="status_message" style="margin-top: 15px; font-size: 13px; text-align: center; font-weight: bold; display: none;"></div>
    </div>

    <div class="branding">
        <svg class="brand-logo" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 5L5 15V30C5 45 20 53 30 55C40 53 55 45 55 30V15L30 5Z" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
            <path d="M18 22V38M18 22L30 30L42 22M42 22V38" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-name">MDMKILLERPRO</div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="#">Support</a> | 
            <a href="#">Contact</a> | 
            <a href="#">FAQ</a> | 
            <a href="#">Global API Docs</a>
        </div>
        <div class="copyright">© 2026 MDMKILLERPRO GLOBAL</div>
    </footer>
</div>

<script>
    async function processActivation() {
        const apiKey = document.getElementById('auth_key').value;
        const email = document.getElementById('customer_email').value;
        const msgBox = document.getElementById('status_message');

        if(!apiKey || !email) {
            alert("Please fill in all fields.");
            return;
        }

        msgBox.style.display = "block";
        msgBox.style.color = "#94a3b8";
        msgBox.innerText = "Processing activation request...";

        try {
            const res = await fetch('/api/v1/activate-user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({api_key: apiKey, user_email: email})
            });
            const data = await res.json();
            
            if(res.ok) {
                msgBox.style.color = "#4ade80";
                msgBox.innerText = "Activation Successful! Remaining credits: " + data.remaining_credits;
            } else {
                msgBox.style.color = "#ef4444";
                msgBox.innerText = "Error: " + (data.error || "Failed to process request");
            }
        } catch(e) {
            msgBox.style.color = "#ef4444";
            msgBox.innerText = "Server connection failed.";
        }
    }
</script>

</body>
</html>
