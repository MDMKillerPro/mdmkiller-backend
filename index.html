        body {

        .container { max-width: 1000px; margin: auto; padding: 40px 20px; }
        
        h1 { font-size: clamp(28px, 5vw, 48px); margin-bottom: 10px; font-weight: 800; }
        .highlight { color: var(--primary); }

        /* Action Buttons */
        .btn-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 30px 0; }
        .btn { 
            padding: 15px 35px; border-radius: 10px; font-weight: bold; 
            text-decoration: none; font-size: 16px; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .download { background: var(--secondary); color: white; box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
        .download:hover { transform: translateY(-3px); box-shadow: 0 0 25px rgba(37, 99, 235, 0.6); }
        
        .buy-btn { background: var(--success); color: white; border: none; cursor: pointer; }
        .buy-btn:hover { background: #059669; transform: translateY(-3px); }

        /* Registration Form Section */
        .register-section {
            background: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 40px;
            margin: 40px auto;
            max-width: 500px;
            text-align: left;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .register-section h2 { margin-top: 0; color: var(--primary); font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-control {
            width: 100%; padding: 12px; background: #050810; border: 1px solid #334155;
            border-radius: 8px; color: white; box-sizing: border-box;
        }

        #reg-status { margin-top: 15px; font-size: 14px; font-weight: 600; text-align: center; }

        .power-panel {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }
        .stat-item { background: rgba(56, 189, 248, 0.05); padding: 20px; border-radius: 15px; border: 1px solid #1e293b; }

        footer { padding: 40px; background: #020617; border-top: 1px solid #1e293b; color: #475569; font-size: 13px; }

        <a href="https://t.me/Mdmkillerpro" class="btn buy-btn">💳 BUY ACTIVATION</a>
    </div>

    <div class="register-section">
        <h2>Quick Registration</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 25px;">Account created here will work directly in the tool.</p>
        
        <div class="form-group">
            <input type="email" id="email" class="form-control" placeholder="Enter Email">
        </div>
        
        <div class="form-group">
            <input type="password" id="password" class="form-control" placeholder="Create Password">
        </div>
        
        <button onclick="handleRegister()" class="btn buy-btn" style="width: 100%; justify-content: center;">REGISTER NOW</button>

    <div class="power-panel">
        <div class="stat-item"><h3>S26</h3><p>Models Added</p></div>
        <div class="stat-item"><h3>AUTO</h3><p>Server System</p></div>

    </div>
</div>

<footer>

</footer>

<script>
    async function handleRegister() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const status = document.getElementById('reg-status');

        if (!email || !password) {
            status.style.color = "#EF4444";
            status.innerText = "Error: All fields required.";
            return;
        }

        status.style.color = "#38BDF8";
        status.innerText = "Registering Account...";

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.status === 201) {
                status.style.color = "#10B981";
                status.innerText = "Success! Account created. Now Login in the Tool.";
                document.getElementById('email').value = "";
                document.getElementById('password').value = "";
            } else {
                status.style.color = "#EF4444";
                status.innerText = "Error: Already Registered.";
            }
        } catch (error) {
            status.style.color = "#EF4444";
            status.innerText = "Server Error. Please try again.";
        }
    }
</script>
